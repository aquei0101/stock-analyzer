name: Fetch Market Data

on:
  schedule:
    # 日本時間の平日、市場に合わせて数回取得
    # UTC 0:00(JST 9:00 寄り後), UTC 3:00(JST 12:00), UTC 6:30(JST 15:30 引け後)
    - cron: "0 0 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "30 6 * * 1-5"
  workflow_dispatch:   # 手動実行ボタン

permissions:
  contents: write   # market_data.json をコミットするため

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance feedparser

      - name: Fetch market data
        run: python fetch_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --staged --quiet || git commit -m "Update market data: $(date -u +'%Y-%m-%d %H:%M')"
          git push
