name: Fetch Market Data

on:
  schedule:
    # 日本時間(JST=UTC+9)の平日 9:00〜15:30 に 5分ごとに取得。
    # JST 9:00-15:30 = UTC 0:00-6:30。
    # UTC 0:00〜5:55 の5分刻み(JST 9:00〜14:55)
    - cron: "*/5 0-5 * * 1-5"
    # UTC 6:00〜6:30 の5分刻み(JST 15:00〜15:30)
    - cron: "0,5,10,15,20,25,30 6 * * 1-5"
  workflow_dispatch:   # 手動実行ボタン

permissions:
  contents: write   # market_data.json をコミットするため

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance feedparser

      - name: Fetch market data
        run: python fetch_data.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --staged --quiet || git commit -m "Update market data: $(date -u +'%Y-%m-%d %H:%M')"
          git push
